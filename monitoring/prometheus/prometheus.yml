global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1. Backend FastAPI (Métricas de negocio, latencia y Machine Learning)
  - job_name: 'fastapi-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          app: 'minimarket-backend'
          environment: &environment '__MONITORING_ENVIRONMENT__'
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'backup_last_(success_timestamp|size_bytes)'
        action: drop

  # 2. cAdvisor (Uso de CPU, RAM y red por contenedor Docker)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          app: 'docker-containers'
          environment: *environment

  # 3. Node Exporter (métricas Linux y archivos textfile)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          app: 'linux-host'
          environment: *environment
