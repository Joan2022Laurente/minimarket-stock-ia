log_format static_access '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    access_log /dev/stdout static_access;
    error_log /dev/stderr warn;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    add_header Cache-Control "no-cache";

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        try_files $uri =404;
    }

    # Solo assets con el hash de contenido que genera Vite.
    location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.[a-zA-Z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las rutas de React Router comparten el HTML, no los recursos inexistentes.
    location ~* ^/(?:(?:login|inventario|ventas|predicciones)/?)?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
